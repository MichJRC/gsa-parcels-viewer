<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
    <title>Parcel Validation Tool</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: "Calibri", "Trebuchet MS", "Ubuntu", sans-serif; 
        }
        #map { 
            position: absolute; 
            top: 0; 
            bottom: 0; 
            width: 100%; 
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 350px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            border-radius: 8px;
            z-index: 1000;
        }
        .info-header {
            background: #7B1FA2;
            color: white;
            padding: 12px;
            border-radius: 8px 8px 0 0;
            font-size: 16px;
            font-weight: bold;
        }
        .info-content {
            padding: 15px;
        }
        .stat-box {
            background: #F3E5F5;
            border: 1px solid #7B1FA2;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #7B1FA2;
        }
        .loading {
            color: #F57C00;
            font-style: italic;
        }
        .error {
            color: #D32F2F;
            background: #FFEBEE;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .success {
            color: #2E7D32;
        }
        
        /* Parcel popup styles */
        .parcel-popup {
            font-family: "Calibri", "Trebuchet MS", "Ubuntu", sans-serif;
        }
        .popup-header {
            font-size: 14px;
            font-weight: bold;
            color: #7B1FA2;
            margin-bottom: 8px;
            border-bottom: 2px solid #7B1FA2;
            padding-bottom: 5px;
        }
        .popup-row {
            margin: 5px 0;
            font-size: 12px;
        }
        .popup-label {
            font-weight: bold;
            color: #555;
        }
        .popup-value {
            color: #333;
        }
        .agreement-match {
            background: #C8E6C9;
            color: #2E7D32;
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: bold;
            display: inline-block;
        }
        .agreement-mismatch {
            background: #FFCDD2;
            color: #C62828;
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: bold;
            display: inline-block;
        }
        .pixel-breakdown {
            margin-top: 8px;
            padding: 8px;
            background: #F5F5F5;
            border-radius: 4px;
            font-size: 11px;
        }
        .pixel-item {
            margin: 3px 0;
        }
        
        /* Parcel styles */
        .parcel-polygon {
            stroke-width: 2;
            fill-opacity: 0.3;
        }
        .parcel-polygon:hover {
            fill-opacity: 0.6;
            stroke-width: 3;
        }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Statistics Panel -->
<div class="info-panel" id="stats-panel">
    <div class="info-header">
        📊 Analysis Panel
    </div>
    <div class="info-content">
        <div class="stat-box">
            <div class="stat-label">Overall Accuracy</div>
            <div class="stat-value" id="overall-accuracy">--</div>
        </div>
        
        <div id="panel-content">
            <p style="color: #666; font-size: 12px;">
                Click on a parcel to see detailed information.<br><br>
                Zoom in (level 12+) and the statistics will calculate automatically for the visible area.
            </p>
        </div>
    </div>
</div>

<script>
// Base layers
var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    minZoom: 10,
    maxZoom: 18
});

var cartodb = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/attribution">CartoDB</a>',
    minZoom: 10,
    maxZoom: 18
});

// GDAL tiles - HIDDEN by default
// Allow upscaling beyond native zoom for visual reference
var gdalTiles = L.tileLayer('/tiles/{z}/{x}/{y}.png', {
    tms: true,
    opacity: 0.7,
    attribution: 'HRL Tiles',
    minZoom: 10,
    maxZoom: 18,           // Tiles only exist up to zoom 14
    maxNativeZoom: 14      // But display them at higher zooms (upscaled)
});

// Initialize map (tiles NOT added to initial layers)
var map = L.map('map', {
    center: [44.6819298660025, 11.65024823991047],
    zoom: 12,
    minZoom: 10,
    maxZoom: 18,
    layers: [osm]  // Only base layer initially
});

// Parcels layer
var parcelsLayer;

// Color mapping function (from vector class name to color)
function getParcelColor(className) {
    const colorMap = {
        'Wheat': '#FFEB3B',
        'Barley': '#FFC107',
        'Maize': '#CDDC39',
        'Rice': '#FBC02D',
        'Other cereals': '#F48FB1',
        'Fresh Vegetables': '#9C27B0',
        'Dry pulses': '#673AB7',
        'Potatoes': '#3F51B5',
        'Sugar Beet': '#2196F3',
        'Sunflower': '#00BCD4',
        'Soybeans': '#009688',
        'Rapeseed': '#4CAF50',
        'Flax, cotton and hemp': '#8BC34A',
        'Grapes': '#FF5722',
        'Olives': '#795548',
        'Fruits': '#9E9E9E',
        'Nuts': '#757575',
        'Unclassified arable crop': '#FF9800',
        'Unclassified permanent crop': '#FFC107',
        'Unmapped': '#BDBDBD'
    };
    return colorMap[className] || '#CCCCCC';
}

// Style function for parcels
function parcelStyle(feature) {
    return {
        fillColor: getParcelColor(feature.properties.hrl_name),
        weight: 2,
        opacity: 1,
        color: '#666',
        fillOpacity: 0.4
    };
}

// Highlight on hover
function highlightParcel(e) {
    var layer = e.target;
    layer.setStyle({
        weight: 4,
        color: '#7B1FA2',
        fillOpacity: 0.7
    });
    layer.bringToFront();
}

// Reset highlight
function resetHighlight(e) {
    parcelsLayer.resetStyle(e.target);
}

// Click handler - fetch raster class and show popup
function onParcelClick(e) {
    var layer = e.target;
    var properties = layer.feature.properties;
    var parcelId = layer.feature.id;
    
    // Show loading popup
    var loadingContent = `
        <div class="parcel-popup">
            <div class="popup-header">Parcel Information</div>
            <p class="loading">Loading raster classification...</p>
        </div>
    `;
    layer.bindPopup(loadingContent).openPopup();
    
    // Fetch raster classification
    fetch('/api/parcel/' + parcelId + '/raster-class')
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                var errorContent = `
                    <div class="parcel-popup">
                        <div class="popup-header">Parcel Information</div>
                        <p class="error">${data.error}</p>
                    </div>
                `;
                layer.getPopup().setContent(errorContent);
                return;
            }
            
            // Build pixel breakdown HTML
            var pixelBreakdownHTML = '<div class="pixel-breakdown"><strong>Raster Pixels:</strong><br>';
            data.pixel_breakdown.forEach(item => {
                pixelBreakdownHTML += `
                    <div class="pixel-item">
                        ${item.class_name}: ${item.pixel_count} pixels (${item.percentage}%)
                    </div>
                `;
            });
            pixelBreakdownHTML += '</div>';
            
            // Determine agreement status
            var agreementHTML = data.agreement 
                ? '<span class="agreement-match">✓ MATCH</span>'
                : '<span class="agreement-mismatch">✗ MISMATCH</span>';
            
            // Build complete popup
            var popupContent = `
                <div class="parcel-popup">
                    <div class="popup-header">Parcel #${parcelId}</div>
                    
                    <div class="popup-row">
                        <span class="popup-label">Soil Code:</span>
                        <span class="popup-value">${properties.COD_SUOLO || 'N/A'}</span>
                    </div>
                    
                    <div class="popup-row">
                        <span class="popup-label">Soil Type:</span>
                        <span class="popup-value">${properties.DESC_SUOLO || 'N/A'}</span>
                    </div>
                    
                    <hr style="margin: 8px 0; border: none; border-top: 1px solid #ddd;">
                    
                    <div class="popup-row">
                        <span class="popup-label">Vector Class:</span>
                        <span class="popup-value">${data.vector_class}</span>
                    </div>
                    
                    <div class="popup-row">
                        <span class="popup-label">Raster Class:</span>
                        <span class="popup-value">${data.raster_dominant_class}</span>
                    </div>
                    
                    <div class="popup-row">
                        <span class="popup-label">Agreement:</span>
                        ${agreementHTML}
                    </div>
                    
                    <div class="popup-row">
                        <span class="popup-label">Purity:</span>
                        <span class="popup-value">${data.purity}%</span>
                    </div>
                    
                    ${pixelBreakdownHTML}
                    
                    <div style="margin-top: 8px; font-size: 10px; color: #999;">
                        Total pixels: ${data.total_pixels}
                    </div>
                </div>
            `;
            
            layer.getPopup().setContent(popupContent);
        })
        .catch(error => {
            console.error('Error fetching raster class:', error);
            var errorContent = `
                <div class="parcel-popup">
                    <div class="popup-header">Error</div>
                    <p class="error">Failed to load raster classification</p>
                </div>
            `;
            layer.getPopup().setContent(errorContent);
        });
}

// Bind events to each parcel
function onEachParcel(feature, layer) {
    layer.on({
        mouseover: highlightParcel,
        mouseout: resetHighlight,
        click: onParcelClick
    });
}

// Load parcels for current map view
function loadParcels() {
    var bounds = map.getBounds();
    var bbox = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
    
    console.log('Loading parcels for bbox:', bbox);
    
    fetch(`/api/parcels?bbox=${bbox}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to load parcels');
            }
            return response.json();
        })
        .then(data => {
            console.log('Parcels loaded:', data.features.length, 'features');
            
            // Remove old layer if exists
            if (parcelsLayer) {
                map.removeLayer(parcelsLayer);
            }
            
            if (data.features.length === 0) {
                console.log('No parcels in this area');
                return;
            }
            
            parcelsLayer = L.geoJSON(data, {
                style: parcelStyle,
                onEachFeature: onEachParcel
            });
            
            // Add to map
            parcelsLayer.addTo(map);
            
            console.log('Parcels displayed on map');
        })
        .catch(error => {
            console.error('Error loading parcels:', error);
            document.getElementById('panel-content').innerHTML = `
                <p class="error">Failed to load parcels: ${error.message}</p>
            `;
        });
}

// Debounced parcel loading
var debouncedLoadParcels = debounce(loadParcels, 800);

// Load parcels when map moves
map.on('moveend', debouncedLoadParcels);

// Initial load
map.whenReady(function() {
    setTimeout(loadParcels, 1000);
});

// Debounce function
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func(...args), wait);
    };
}

// Add this function to your map.html (in the <script> section)
// Place it BEFORE the updateViewportStats() function

function buildConfusionMatrixTable(data) {
    if (!data.confusion_matrix || Object.keys(data.confusion_matrix).length === 0) {
        return '<p style="color: #999; font-size: 12px;">No confusion matrix data available</p>';
    }
    
    const matrix = data.confusion_matrix;
    const vectorClasses = Object.keys(matrix).sort();
    
    // Get all raster classes that appear in the matrix
    const rasterClassesSet = new Set();
    vectorClasses.forEach(vClass => {
        Object.keys(matrix[vClass]).forEach(rClass => {
            rasterClassesSet.add(rClass);
        });
    });
    const rasterClasses = Array.from(rasterClassesSet).sort();
    
    // Calculate max value for heat map scaling
    let maxValue = 0;
    vectorClasses.forEach(vClass => {
        Object.values(matrix[vClass]).forEach(count => {
            maxValue = Math.max(maxValue, count);
        });
    });
    
    // Build table HTML
    let html = '<div class="confusion-matrix-container" style="margin-top: 15px; overflow-x: auto;">';
    html += '<h3 style="font-size: 13px; margin-bottom: 8px;">📊 Confusion Matrix</h3>';
    html += '<div style="font-size: 10px; color: #666; margin-bottom: 8px;">';
    html += '<strong>Rows:</strong> Farmer Declaration | <strong>Cols:</strong> Satellite Classification';
    html += '</div>';
    
    html += '<table class="confusion-matrix-table" style="width: 100%; border-collapse: collapse; font-size: 10px; background: white;">';
    
    // Header row
    html += '<thead><tr>';
    html += '<th style="padding: 6px 4px; border: 1px solid #ddd; background: #7B1FA2; color: white; text-align: left;">Farmer \\ Satellite</th>';
    rasterClasses.forEach(rClass => {
        const shortName = rClass.length > 12 ? rClass.substring(0, 10) + '..' : rClass;
        html += `<th style="padding: 6px 4px; border: 1px solid #ddd; background: #7B1FA2; color: white; text-align: center;" title="${rClass}">${shortName}</th>`;
    });
    html += '<th style="padding: 6px 4px; border: 1px solid #ddd; background: #7B1FA2; color: white;">Total</th>';
    html += '<th style="padding: 6px 4px; border: 1px solid #ddd; background: #7B1FA2; color: white;">Acc.</th>';
    html += '</tr></thead>';
    
    // Data rows
    html += '<tbody>';
    vectorClasses.forEach(vClass => {
        html += '<tr>';
        
        // Row header (vector class)
        const shortVName = vClass.length > 15 ? vClass.substring(0, 13) + '..' : vClass;
        html += `<th style="padding: 6px 4px; border: 1px solid #ddd; background: #9C27B0; color: white; text-align: left;" title="${vClass}">${shortVName}</th>`;
        
        // Calculate row total
        const rowTotal = Object.values(matrix[vClass]).reduce((a, b) => a + b, 0);
        
        // Data cells
        rasterClasses.forEach(rClass => {
            const count = matrix[vClass][rClass] || 0;
            const isDiagonal = (vClass === rClass);
            
            let cellStyle = 'padding: 6px 4px; border: 1px solid #ddd; text-align: center;';
            let displayValue = count > 0 ? count.toLocaleString() : '-';
            
            if (count === 0) {
                cellStyle += ' background: #F5F5F5; color: #999;';
            } else if (isDiagonal) {
                cellStyle += ' background: #C8E6C9; font-weight: bold; color: #2E7D32;';
            } else {
                // Error cell - apply heat map
                const errorPercent = (count / maxValue) * 100;
                if (errorPercent < 10) {
                    cellStyle += ' background: #FFF9C4;';
                } else if (errorPercent < 30) {
                    cellStyle += ' background: #FFE082;';
                } else {
                    cellStyle += ' background: #FFCDD2; font-weight: bold;';
                }
            }
            
            const percentage = rowTotal > 0 ? ((count / rowTotal) * 100).toFixed(1) : '0.0';
            const title = `${vClass} → ${rClass}: ${count} pixels (${percentage}%)`;
            
            html += `<td style="${cellStyle}" title="${title}">${displayValue}</td>`;
        });
        
        // Row total
        html += `<td style="padding: 6px 4px; border: 1px solid #ddd; background: #E1BEE7; font-weight: bold; text-align: center;">${rowTotal.toLocaleString()}</td>`;
        
        // Row accuracy (Producer's accuracy)
        const classMetrics = data.class_metrics[vClass];
        if (classMetrics) {
            const acc = classMetrics.producers_accuracy;
            let badgeStyle = 'display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold;';
            if (acc >= 85) {
                badgeStyle += ' background: #C8E6C9; color: #2E7D32;';
            } else if (acc >= 70) {
                badgeStyle += ' background: #FFF9C4; color: #F57C00;';
            } else {
                badgeStyle += ' background: #FFCDD2; color: #C62828;';
            }
            
            html += `<td style="padding: 6px 4px; border: 1px solid #ddd; text-align: center;"><span style="${badgeStyle}">${acc}%</span></td>`;
        } else {
            html += '<td style="padding: 6px 4px; border: 1px solid #ddd;">-</td>';
        }
        
        html += '</tr>';
    });
    html += '</tbody>';
    
    html += '</table>';
    
    // Legend
    html += '<div style="margin-top: 10px; padding: 8px; background: #F5F5F5; border-radius: 4px; font-size: 10px;">';
    html += '<strong>Legend:</strong> ';
    html += '<span style="display: inline-block; margin-right: 10px;"><span style="display: inline-block; width: 15px; height: 15px; background: #C8E6C9; border: 1px solid #999; margin-right: 4px; vertical-align: middle;"></span>Correct</span>';
    html += '<span style="display: inline-block; margin-right: 10px;"><span style="display: inline-block; width: 15px; height: 15px; background: #FFF9C4; border: 1px solid #999; margin-right: 4px; vertical-align: middle;"></span>Low Error</span>';
    html += '<span style="display: inline-block; margin-right: 10px;"><span style="display: inline-block; width: 15px; height: 15px; background: #FFE082; border: 1px solid #999; margin-right: 4px; vertical-align: middle;"></span>Med Error</span>';
    html += '<span style="display: inline-block; margin-right: 10px;"><span style="display: inline-block; width: 15px; height: 15px; background: #FFCDD2; border: 1px solid #999; margin-right: 4px; vertical-align: middle;"></span>High Error</span>';
    html += '</div>';
    
    html += '</div>';
    
    return html;
}

function updateViewportStats() {
    var zoom = map.getZoom();
    
    if (zoom < 14) {
        document.getElementById('overall-accuracy').textContent = '--';
        document.getElementById('panel-content').innerHTML = `
            <p style="color: #F57C00; font-size: 12px;">
                ⚠️ Zoom in to level 14 or higher to see statistics.
                <br><br>Current zoom: ${zoom}
            </p>
        `;
        return;
    }
    
    var bounds = map.getBounds();
    var bbox = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
    
    document.getElementById('panel-content').innerHTML = `
        <p style="color: #F57C00; font-style: italic;">⏳ Calculating statistics...</p>
    `;
    
    fetch(`/api/analysis/viewport-stats?bbox=${bbox}&zoom=${zoom}`)
        .then(response => response.json())
        .then(data => {
            if (data.message || data.error) {
                document.getElementById('overall-accuracy').textContent = '--';
                document.getElementById('panel-content').innerHTML = `
                    <p style="color: #F57C00; font-size: 12px;">${data.message || data.error}</p>
                `;
                return;
            }
            
            // Update overall accuracy
            document.getElementById('overall-accuracy').textContent = data.overall_accuracy + '%';
            
            // Build statistics HTML
            var html = `
                <div style="margin-bottom: 15px;">
                    <strong>Viewport Statistics:</strong><br>
                    <div style="margin-top: 8px; font-size: 12px;">
                        Parcels: <strong>${data.total_parcels}</strong><br>
                        Analyzed: <strong>${data.processed_parcels}</strong><br>
                        Pixels: <strong>${data.total_pixels.toLocaleString()}</strong><br>
                        Correct: <strong style="color: #2E7D32;">${data.correct_pixels.toLocaleString()}</strong><br>
                        Errors: <strong style="color: #D32F2F;">${(data.total_pixels - data.correct_pixels).toLocaleString()}</strong>
                    </div>
                </div>
            `;
            
            // ADD THE CONFUSION MATRIX TABLE HERE
            html += buildConfusionMatrixTable(data);
            
            // Add interpretation guide
            html += `
                <div style="margin-top: 15px; padding: 10px; background: #E8F5E9; border-radius: 4px; font-size: 11px;">
                    <strong style="color: #2E7D32;">💡 How to Read:</strong>
                    <ul style="margin: 5px 0 0 20px; padding: 0;">
                        <li><strong>Green diagonal:</strong> Correct matches</li>
                        <li><strong>Off-diagonal:</strong> Misclassifications</li>
                        <li><strong>0% accuracy:</strong> No pixels matched the farmer's declaration</li>
                    </ul>
                </div>
            `;
            
            document.getElementById('panel-content').innerHTML = html;
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('overall-accuracy').textContent = '--';
            document.getElementById('panel-content').innerHTML = `
                <p style="color: #D32F2F; background: #FFEBEE; padding: 8px; border-radius: 4px; font-size: 12px;">
                    Error: ${error.message}
                </p>
            `;
        });
}

// Update viewport statistics
function updateViewportStats() {
    var zoom = map.getZoom();
    
    if (zoom < 14) {
        document.getElementById('overall-accuracy').textContent = '--';
        document.getElementById('panel-content').innerHTML = `
            <p style="color: #F57C00; font-size: 12px;">
                ⚠️ Zoom in to level 14 or higher to see statistics for the visible area.
                <br><br>Current zoom: ${zoom}
            </p>
        `;
        return;
    }
    
    var bounds = map.getBounds();
    var bbox = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
    
    document.getElementById('panel-content').innerHTML = `
        <p class="loading">⏳ Calculating statistics...</p>
    `;
    
    fetch(`/api/analysis/viewport-stats?bbox=${bbox}&zoom=${zoom}`)
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                document.getElementById('overall-accuracy').textContent = '--';
                document.getElementById('panel-content').innerHTML = `
                    <p style="color: #F57C00; font-size: 12px;">${data.message}</p>
                `;
                return;
            }
            
            if (data.error) {
                document.getElementById('overall-accuracy').textContent = '--';
                document.getElementById('panel-content').innerHTML = `
                    <p class="error">${data.error}</p>
                `;
                return;
            }
            
            // Update overall accuracy
            document.getElementById('overall-accuracy').textContent = data.overall_accuracy + '%';
            
            // Build statistics HTML
            var html = `
                <div style="margin-bottom: 15px;">
                    <strong>Viewport Statistics:</strong><br>
                    <div style="margin-top: 8px; font-size: 12px;">
                        Parcels: <strong>${data.total_parcels}</strong><br>
                        Analyzed: <strong>${data.processed_parcels}</strong><br>
                        Pixels: <strong>${data.total_pixels.toLocaleString()}</strong><br>
                        Correct: <strong>${data.correct_pixels.toLocaleString()}</strong><br>
                        Errors: <strong>${(data.total_pixels - data.correct_pixels).toLocaleString()}</strong>
                    </div>
                </div>
                
                <div style="margin-bottom: 10px;">
                    <strong>Per-Class Accuracy:</strong>
                </div>
            `;

            html += buildConfusionMatrixTable(data);

            html += `<div style="margin-top: 15px; margin-bottom: 10px;">
                <strong>Per-Class Summary:</strong>
            </div>`;
            
            // Add per-class metrics
            for (const [className, metrics] of Object.entries(data.class_metrics)) {
                var accuracyColor = metrics.producers_accuracy >= 95 ? '#2E7D32' : 
                                   metrics.producers_accuracy >= 85 ? '#F57C00' : '#D32F2F';
                
                html += `
                    <div style="margin: 8px 0; padding: 8px; background: #F5F5F5; border-radius: 4px; font-size: 11px;">
                        <div style="font-weight: bold; color: #333;">${className}</div>
                        <div style="margin-top: 3px;">
                            Accuracy: <span style="color: ${accuracyColor}; font-weight: bold;">${metrics.producers_accuracy}%</span>
                            (${metrics.correct_pixels}/${metrics.total_pixels} pixels)
                        </div>
                    </div>
                `;
            }
            
            html += `
                <div style="margin-top: 15px; padding: 10px; background: #E8F5E9; border-radius: 4px; font-size: 11px;">
                    <strong style="color: #2E7D32;">💡 Tip:</strong> Click on parcels to see individual classification details.
                </div>
            `;
            
            document.getElementById('panel-content').innerHTML = html;
        })
        .catch(error => {
            console.error('Error calculating stats:', error);
            document.getElementById('overall-accuracy').textContent = '--';
            document.getElementById('panel-content').innerHTML = `
                <p class="error">Error calculating statistics: ${error.message}</p>
            `;
        });
}

// Debounced version - wait 500ms after user stops moving
var debouncedUpdateStats = debounce(updateViewportStats, 500);

// Attach to map events
map.on('moveend', debouncedUpdateStats);
map.on('zoomend', debouncedUpdateStats);

// Layer control - tiles OFF by default
// Position it on the LEFT to avoid overlap with stats panel
var basemaps = {
    "OpenStreetMap": osm,
    "CartoDB Positron": cartodb
};

var overlays = {
    "HRL Raster Tiles (2021)": gdalTiles
};

var layerControl = L.control.layers(basemaps, overlays, {
    collapsed: false,
    position: 'topleft'  // Move to top-left corner
}).addTo(map);

// Initial stats update (if zoom is sufficient)
map.whenReady(function() {
    setTimeout(function() {
        if (map.getZoom() >= 12) {
            updateViewportStats();
        }
    }, 3000);  // Wait for parcels to load
});

</script>
